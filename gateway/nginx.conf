# Brake on the SQL screen: a participant clicking fast is fine, a script is not.
# Behind Nginx Proxy Manager the visitor address is in X-Forwarded-For.
limit_req_zone $http_x_forwarded_for$remote_addr zone=sql:1m rate=30r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    # Same security headers as methodica.nl (no inline scripts or styles).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Fictional company on a real domain: stay out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    location = /klantsysteem { return 301 /klantsysteem/; }
    location = /klantbeeld   { return 301 /klantbeeld/; }

    location = /klantsysteem/sql {
        limit_req zone=sql burst=10 nodelay;
        client_max_body_size 20k;
        proxy_pass http://klantsysteem:3000;
        add_header X-Robots-Tag "noindex" always;
    }

    # The systems are exercise tools, not content: keep them out of search engines.
    location /klantsysteem/ {
        proxy_pass http://klantsysteem:3000;
        add_header X-Robots-Tag "noindex" always;
    }

    location /klantbeeld/ {
        proxy_pass http://klantbeeld:3000;
        add_header X-Robots-Tag "noindex" always;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
