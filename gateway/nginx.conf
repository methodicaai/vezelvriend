# Rate limits. Behind Nginx Proxy Manager the visitor address is in X-Forwarded-For.
#
# A whole training group often shares ONE IP address (the office network). So:
# - limits for the SQL screen and the AI count per participant (the login
#   cookie), and only fall back to the IP address for visitors without one;
# - the participant login limit per IP is generous enough for a full group
#   logging in at once (guessing codes is stopped by the app, per failed try);
# - the trainer login stays strict: only one person logs in there.
map $cookie_vv_ai $visitor_key {
    ""      $http_x_forwarded_for$remote_addr;
    default $cookie_vv_ai;
}
limit_req_zone $visitor_key zone=sql:2m rate=30r/m;
limit_req_zone $visitor_key zone=ai:2m rate=20r/m;
limit_req_zone $http_x_forwarded_for$remote_addr zone=login:1m rate=120r/m;
limit_req_zone $http_x_forwarded_for$remote_addr zone=trainerlogin:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    server_tokens off;

    # Pass the real site address on to the systems. Without this they see
    # "ai:3000" as host, and the trainer screen rejects its own forms
    # (it checks that a form comes from the same site).
    proxy_set_header Host $host;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml text/plain application/json;

    # Same security headers as methodica.nl (no inline scripts or styles).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Fictional company on a real domain: stay out of search engines.
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https://service.pdok.nl; style-src 'self'; script-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    error_page 404 /404.html;

    # The training pages moved from / to /training/ when the company website
    # took over the front page; old links keep working.
    location = /bedrijf/        { return 301 /training/bedrijf/; }
    location = /systemen/       { return 301 /training/systemen/; }
    location = /over-methodica/ { return 301 /training/over-methodica/; }
    location ^~ /oefeningen/    { rewrite ^/oefeningen/(.*)$ /training/oefeningen/$1 permanent; }

    # The exercises are only for participants: every page under
    # /training/oefeningen/ is checked first with the AI box (participant code
    # or trainer login). Without a valid login: off to the login page, which
    # sends the visitor back afterwards.
    location ^~ /training/oefeningen/ {
        auth_request /_check-login;
        error_page 401 = @inloggen;
        expires -1;
        try_files $uri $uri/ =404;
    }
    location = /_check-login {
        internal;
        proxy_pass http://ai:3000/api/ai/check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }
    location @inloggen {
        return 302 /training/inloggen/?terug=$uri;
    }

    location = /klantsysteem { return 301 /klantsysteem/; }
    location = /klantbeeld   { return 301 /klantbeeld/; }

    location = /klantsysteem/sql {
        limit_req zone=sql burst=10 nodelay;
        client_max_body_size 20k;
        proxy_read_timeout 60s;      # queries may wait their turn (max 4 at a time)
        proxy_pass http://klantsysteem:3000;
        add_header X-Robots-Tag "noindex" always;
    }

    # The systems are exercise tools, not content: keep them out of search engines.
    location /klantsysteem/ {
        proxy_pass http://klantsysteem:3000;
        add_header X-Robots-Tag "noindex" always;
    }

    # AI box and trainer screen (systems/ai). Never cached, never indexed.
    location = /api/ai/login {
        limit_req zone=login burst=60 nodelay;
        client_max_body_size 4k;
        proxy_pass http://ai:3000;
    }
    location = /trainer/login {
        limit_req zone=trainerlogin burst=5 nodelay;
        client_max_body_size 4k;
        proxy_pass http://ai:3000;
    }
    location = /api/ai/ask {
        limit_req zone=ai burst=10 nodelay;
        client_max_body_size 256k;
        proxy_read_timeout 180s;     # long prompts can take a while
        proxy_pass http://ai:3000;
    }
    # Customer app API (systems/mijn).
    location = /api/mijn/login {
        limit_req zone=login burst=60 nodelay;
        client_max_body_size 4k;
        proxy_pass http://mijn:3000;
    }
    # Orders from the package builder: a few per visitor, small bodies.
    location = /api/mijn/bestelling {
        limit_req zone=login burst=20 nodelay;
        client_max_body_size 4k;
        proxy_pass http://mijn:3000;
        add_header Cache-Control "no-store" always;
    }
    location /api/mijn/ {
        client_max_body_size 4k;
        proxy_pass http://mijn:3000;
        add_header Cache-Control "no-store" always;
    }

    location /api/ai/ {
        proxy_pass http://ai:3000;
    }
    location /trainer/ {
        client_max_body_size 64k;
        proxy_pass http://ai:3000;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "no-store" always;
    }
    location = /trainer { return 301 /trainer/; }

    location /klantbeeld/ {
        proxy_pass http://klantbeeld:3000;
        add_header X-Robots-Tag "noindex" always;
    }

    # Stylesheets, fonts and images: always check for a newer version (ETag),
    # so a change is visible straight away, as on methodica.nl. 'expires' does
    # not use add_header, so the security headers above stay in place.
    # Web app manifest of the customer app: nginx does not know the extension.
    location = /app/manifest.webmanifest {
        default_type application/manifest+json;
        expires -1;
    }

    location ~ ^/(assets|vv)/ {
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ =404;
    }
}
