# Starts the whole Vezelvriend training environment:
#   docker compose up --build
# then open http://localhost:8080
#
# Only the gateway is published, and only on 127.0.0.1: on the server,
# Nginx Proxy Manager forwards the public domain to it (see docs/server.md).
services:
  gateway:
    build: { context: ., dockerfile: gateway/Dockerfile }
    ports:
      - "127.0.0.1:${VEZELVRIEND_PORT:-8080}:80"
    depends_on: [klantsysteem, klantbeeld, ai, mijn, koppeling]
    restart: unless-stopped
    mem_limit: 128m
    read_only: true          # nginx only needs a few writable temp folders
    tmpfs: [/var/cache/nginx, /var/run, /tmp]
    security_opt: [no-new-privileges:true]

  klantsysteem:
    build: { context: ., dockerfile: systems/Dockerfile }
    command: ["node", "systems/klantsysteem/server.js"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]          # a Node app on port 3000 needs no Linux capabilities
    environment:
      BASE_PATH: /klantsysteem
      KLANTBEELD_URL: /klantbeeld
      ORDERS_FILE: /orders/orders.json
    restart: unless-stopped
    mem_limit: 256m
    read_only: true          # the database is rebuilt in /tmp on every start
    tmpfs: [/tmp]
    volumes:
      - orders:/orders:ro    # orders from the website become customers here (read only)

  klantbeeld:
    build: { context: ., dockerfile: systems/Dockerfile }
    command: ["node", "systems/klantbeeld/server.js"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]          # a Node app on port 3000 needs no Linux capabilities
    environment:
      BASE_PATH: /klantbeeld
      KLANTSYSTEEM_URL: /klantsysteem
      KOPPELING_URL: http://koppeling:3000
      ORDERS_FILE: /orders/orders.json
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - orders:/orders:ro

  # "Mijn Vezelvriend": API of the customer app at /app/ and of the order form
  # on the website. The only system that writes orders (volume "orders").
  # Gets only the cookie secret from .env, not the AI key: least privilege.
  mijn:
    build: { context: ., dockerfile: systems/Dockerfile }
    command: ["node", "systems/mijn/server.js"]
    environment:
      SESSION_SECRET: ${SESSION_SECRET:-}
      ORDERS_FILE: /orders/orders.json
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - orders:/orders

  # The AI connection: tools an AI may use to look things up in the systems
  # (for the Vezelvriend chat, and over MCP for an AI app of the participant).
  # Has the data but no secrets; checks connection keys with the AI box.
  koppeling:
    build: { context: ., dockerfile: systems/Dockerfile }
    command: ["node", "systems/koppeling/server.js"]
    environment:
      AI_URL: http://ai:3000
      ORDERS_FILE: /orders/orders.json
      KOPPELING_DATA: /koppeling
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    volumes:
      - orders:/orders:ro
      - koppeling-data:/koppeling   # technician requests and the log of what the AI looked up

  # AI box for the exercises: participant codes, Claude calls, stored conversations.
  # Secrets (API key, trainer password) come from .env on the server only.
  ai:
    build: { context: ., dockerfile: systems/ai/Dockerfile }
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    mem_limit: 256m
    read_only: true
    tmpfs: [/tmp]
    environment:
      ORDERS_FILE: /orders/orders.json
      KOPPELING_URL: http://koppeling:3000
      KLANTBEELD_INTERNAL_URL: http://klantbeeld:3000/klantbeeld   # the customers participants get (step 3 and 4)
    volumes:
      - ai-data:/data      # the conversations database survives restarts and updates
      - orders:/orders     # the trainer wipes the website orders from the trainer screen

volumes:
  ai-data:
  orders:
  koppeling-data:
